name: Release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: Run a real two-hour Chromium playback soak
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install uv==0.9.5
      - run: uv sync --frozen --group dev
        working-directory: hub
      - run: uv run pytest -q -n 4 --junitxml=../reports/server.xml
        working-directory: hub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: server-results
          path: reports/
          retention-days: 14
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install uv==0.9.5
      - run: uv sync --frozen --group dev
        working-directory: hub
      - run: npm ci && npm run build && npm run test:unit && npm audit --audit-level=high
        working-directory: web
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - name: Start disposable acceptance backend
        run: |
          mkdir -p reports
          cd hub
          uv run python ../tests/browser_server.py > ../reports/browser-server.log 2>&1 &
          python ../tests/wait_server.py http://127.0.0.1:18082/healthz
      - run: npm run test:e2e -- acceptance.spec.ts
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-results
          path: |
            web/test-results/
            web/playwright-report/
            reports/
          retention-days: 14
  image:
    needs: [server, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python scripts/release_check.py --public-config
      - run: docker build -f hub/Dockerfile -t qqmusic-hub:check .
      - run: docker run --rm --network none -e PYTHONPATH=/app -v "$PWD/scripts:/checks:ro" --entrypoint python qqmusic-hub:check /checks/benchmark_music.py --users 10 --tracks 20 --workers 10 --requests 40
  soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install uv==0.9.5
      - run: uv sync --frozen --group dev
        working-directory: hub
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: web
      - run: |
          mkdir -p reports
          cd hub
          uv run python ../tests/browser_server.py > ../reports/browser-server.log 2>&1 &
          python ../tests/wait_server.py http://127.0.0.1:18082/healthz
      - run: npm run test:soak
        working-directory: web
        env:
          QQM_SOAK_SECONDS: '7200'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: two-hour-soak
          path: web/test-results/
          retention-days: 30
