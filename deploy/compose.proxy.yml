# Docker Compose 2.24.4+. External reverse proxy terminates HTTPS.
# Combine only with docker-compose.yml, not compose.public.yml.
services:
  hub:
    ports: !override
      - "${QQM_BIND_IP:?set QQM_BIND_IP to the server LAN or VPN IP}:8081:8080"
    environment:
      PUBLIC_MODE: "true"
      PUBLIC_HUB_URL: https://${QQM_DOMAIN:?set QQM_DOMAIN}
      PUBLIC_MUSIC_URL: ""
  navidrome:
    ports: !override
      - "127.0.0.1:4533:4533"
